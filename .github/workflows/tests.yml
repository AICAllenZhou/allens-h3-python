name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Integration tests need a live GPU endpoint and a credential, so only
      # the fully-mocked unit tests run in CI.
      - name: Unit tests
        run: pytest -m "not integration" -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Verify no credentials in the artefacts
        run: |
          if grep -rInE 'h3s_[A-Za-z0-9._-]{20,}|h3c_[a-f0-9]{16}|verify[[:space:]]*=[[:space:]]*False' src/; then
            echo "::error::credential-shaped string or TLS bypass found in src/"
            exit 1
          fi
          echo "clean"
